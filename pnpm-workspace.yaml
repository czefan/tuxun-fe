# pnpm 10 起，安装行为的配置从 .npmrc 迁到了这里；写在 .npmrc 里的
# shamefully-hoist / auto-install-peers 等键会被静默忽略（pnpm config get 返回 undefined）。
#
# shamefullyHoist 必须开：@dcloudio/vite-plugin-uni 强制
# resolve.preserveSymlinks = true，模块解析只会沿 node_modules/ 逐级向上找，
# 看不到 pnpm 的 .pnpm 隔离目录。不提升的话，msw、@tanstack/vue-query 等包的
# 间接依赖必须逐个补进 package.json 才能构建（历史上就是这么绕过去的）。
strictPeerDependencies: false
autoInstallPeers: true
ignoreWorkspaceRootCheck: true

shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@uni-helper/unocss-preset-uni': true
  core-js: true
  core-js-pure: true
  esbuild: true
  less: true
  msw: true
  protobufjs: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

catalog:
