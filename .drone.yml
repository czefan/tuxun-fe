kind: pipeline
type: docker
name: build

steps:
  - name: build
    image: node:24.21.0-alpine
    commands:
      - npm install --global "$(node -p 'require("./package.json").packageManager')"
      - pnpm config set registry http://registry.npmmirror.com
      - pnpm config set store-dir /root/.pnpm-store
      - pnpm install --frozen-lockfile
      - pnpm check
      - pnpm build:h5
    volumes:
      - name: pnpm_store
        path: /root/.pnpm-store

  - name: deploy
    image: alpine
    commands:
      - |
        set -eu
        mkdir -p /var/www
        for entry in dist/build/h5/*; do
          [ "$(basename "$entry")" = index.html ] && continue
          cp -R "$entry" /var/www/
        done
        deploy_index=$(mktemp /var/www/.index.XXXXXX)
        trap 'rm -f "$deploy_index"' EXIT
        cp dist/build/h5/index.html "$deploy_index"
        chmod 644 "$deploy_index"
        mv -f "$deploy_index" /var/www/index.html
    volumes:
      - name: www
        path: /var/www

volumes:
  - name: www
    host:
      path: /tz-master-data/app_data/front-end/${DRONE_REPO_NAME,,}
  - name: pnpm_store
    host:
      path: /tz-master-data/app_cache/pnpm

trigger:
  event:
    - tag
