<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>正在退出</title>
    <style>
      body {
        margin: 0;
        background: #f1dfc5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <script>
      ;(function () {
        var t = new URLSearchParams(location.search).get('target') || ''
        // 只允许跳到授权服务域名，避免变成开放重定向
        var ALLOW = ['https://oauth.tiaozhan.com', 'http://localhost:8088', 'http://127.0.0.1:8088']
        var ok = ALLOW.some(function (p) {
          return t.indexOf(p + '/') === 0 || t.indexOf(p + '?') === 0 || t === p
        })
        if (ok) {
          location.replace(t)
        } else {
          document.body.innerHTML =
            '<div style="text-align:center;font-size:14px;color:#756c5e;line-height:1.8;">退出配置有误，请返回小程序重试。</div>'
        }
      })()
    </script>
  </body>
</html>
