<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>已退出</title>
    <style>
      body {
        margin: 0;
        background: #f1dfc5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
      ;(function () {
        var done = false
        function go() {
          if (done) return
          if (window.wx && wx.miniProgram) {
            done = true
            // 「我的」是 tabBar 页，用 switchTab 更稳
            wx.miniProgram.switchTab({ url: '/pages/my/index' })
          }
        }
        go()
        window.addEventListener('load', go)
        var t = setInterval(function () {
          go()
          if (done) clearInterval(t)
        }, 100)
        setTimeout(function () {
          clearInterval(t)
          if (!done) {
            document.body.innerHTML =
              '<div style="text-align:center;font-size:14px;color:#756c5e;line-height:1.8;">已退出登录，请点击左上角返回小程序。</div>'
          }
        }, 5000)
      })()
    </script>
  </body>
</html>
